name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A running deployment is not cancelled, so a
# production deploy is never left half-finished.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check and export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the pinned version from the "packageManager" field (bun@1.3.14).
          bun-version-file: package.json

      - run: bun --version

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - uses: actions/configure-pages@v6

      # Static export with basePath /buzzvel-fe-test into out/.
      - run: bun run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
